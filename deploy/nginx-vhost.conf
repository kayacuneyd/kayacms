# KayaCMS — Nginx vhost örneği (VPS / shared hosting)
#
# - `public/` klasörünü web root yapın (CI4 gereği).
# - Aşağıdaki değerleri kendinize göre düzenleyin.
# - PHP8

server {
    listen 80;
    server_name kayacms.example.com;

    root /var/www/kayacms/public;
    index index.php;

    # HTTP → HTTPS (production güvenlik).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kayacms.example.com;

    root /var/www/kayacms/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/kayacms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kayacms.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Statik dosyalar doğrudan servis edilir (browser cache 30 gün).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # CI4 front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 300;
    }

    # Gizli dosyalar ve yazılabilir dizinlere dışarıdan erişim engellenir.
    location ~ /(\.env|\.git|writable)/ {
        deny all;
    }
}